# Render Blueprint — the M1 skeleton production deploy. No media in production yet: the R2
# bucket is empty, the gate admits only its owner, and AUTH_MODE=closed answers 401 on every
# user route until M4. It exists to surface config, migration and presign failures now.
#
# Secrets marked `sync: false` are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: goalstream-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # sleeps when idle; fine for a gated skeleton, revisit at M4.5
    branch: main
    autoDeployTrigger: checksPass # deploy only after the GitHub CI run is green
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: prod
      - key: HTTP_ADDR
        value: ":10000" # Render's default PORT
      - key: LOG_LEVEL
        value: info
      - key: AUTH_MODE
        value: closed
      - key: GATE_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: INVITE_CODES # id:code — D16: one invite, for me
        sync: false
      - key: INVITE_SECRET
        generateValue: true # 256 random bits, generated by Render
      - key: DATABASE_URL
        fromDatabase:
          name: goalstream-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: goalstream-redis
          property: connectionString
      # Cloudflare R2 — config only; the same code talks to MinIO locally.
      - key: S3_ENDPOINT # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_PUBLIC_ENDPOINT # same as S3_ENDPOINT for R2; the prod guard rejects internal hosts
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_USE_PATH_STYLE
        value: "true"

  - type: keyvalue
    name: goalstream-redis
    plan: free
    maxmemoryPolicy: allkeys-lru # rate-limit windows only; nothing here is truth
    ipAllowList: [] # internal connections only

databases:
  - name: goalstream-db
    plan: free # expires after 30 days on Render's free tier — upgrade before M4.5
    postgresMajorVersion: "16"
    ipAllowList: [] # internal connections only
