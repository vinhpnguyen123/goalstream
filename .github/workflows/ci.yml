# One workflow for every gate (docs/GIT_RULES.md § CI). Render deploys wait for it.
name: ci

on:
  push:
    branches: [main, "milestone/**"]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: make test

      # ponytail: the local stack IS the CI stack — same compose file, same placeholder .env,
      # so CI cannot drift from what `make up` runs on a laptop.
      - name: start postgres, redis, minio
        run: cp .env.example .env && make up
      # A slow apt mirror hung this step twice, silently (2026-10-23 until the 30-min job timeout,
      # 2026-10-26 until the 5-min one); it normally takes ~15 s. Each attempt is cut at 2 min and
      # retried, up to 3; install output stays visible so the next hang shows where it stops.
      # Recommended packages ffprobe never needs are skipped.
      - name: install ffmpeg
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update -qq &&
               sudo timeout 120 apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or hung; retrying"
            sleep 5
          done
          exit 1
      - run: make fixtures # generated media only — NDA footage never reaches CI
      - run: make test-integration

      - run: go build ./cmd/...
      - name: build the api image Render deploys
        run: docker build -q -t goalstream-api .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
