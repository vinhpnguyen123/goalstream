# One workflow for every gate (docs/GIT_RULES.md § CI). Render deploys wait for it.
name: ci

on:
  push:
    branches: [main, "milestone/**"]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: make test

      # ponytail: the local stack IS the CI stack — same compose file, same placeholder .env,
      # so CI cannot drift from what `make up` runs on a laptop.
      - name: start postgres, redis, minio
        run: cp .env.example .env && make up
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: make fixtures # generated media only — NDA footage never reaches CI
      - run: make test-integration

      - run: go build ./cmd/...
