# One workflow for every gate (docs/GIT_RULES.md § CI). Render deploys wait for it.
name: ci

on:
  push:
    branches: [main, "milestone/**"]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: make test

      # ponytail: the local stack IS the CI stack — same compose file, same placeholder .env,
      # so CI cannot drift from what `make up` runs on a laptop.
      - name: start postgres, redis, minio
        run: cp .env.example .env && make up
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: make fixtures # generated media only — NDA footage never reaches CI
      - run: make test-integration

      - run: go build ./cmd/...
      - name: build the api image Render deploys
        run: docker build -q -t goalstream-api .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
