# Main config for the local cache (M9). It replaces the image's own only to add what must sit
# in the main context: the njs module, and the two variables invite.js reads (nginx clears the
# environment of its workers except for names listed by `env`). Secrets never enter a rendered
# config file. Everything else lives in default.conf.template.
load_module modules/ngx_http_js_module.so;

env INVITE_SECRET;
env INVITE_CODES;

user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
